name: Build and Package

on:
  push:
    tags:
      - 'v*'           # trigger on version tags like v0.4.0
  workflow_dispatch:   # allow manual trigger

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            jpackage-type: DEB
            artifact-pattern: '*.deb'
            artifact-name: jcs-linux
          - os: macos-latest
            jpackage-type: DMG
            artifact-pattern: '*.dmg'
            artifact-name: jcs-macos
          - os: windows-latest
            jpackage-type: EXE
            artifact-pattern: '*.exe'
            artifact-name: jcs-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and package
        run: mvn verify -P package-app -Djpackage.type=${{ matrix.jpackage-type }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: target/jpackage/${{ matrix.artifact-pattern }}
          retention-days: 30

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jcs-linux/*.deb
            jcs-macos/*.dmg
            jcs-windows/*.exe
